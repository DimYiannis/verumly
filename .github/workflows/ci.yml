name: CI
on:
  push:
    branches: [main]
  pull_request:

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: receipts
        ports: ["5433:5432"]
        options: >-
          --health-cmd "pg_isready -U postgres -d receipts" --health-interval 2s --health-retries 30
      mailpit:
        image: axllent/mailpit
        ports: ["1025:1025", "8025:8025"]
      s3:
        image: adobe/s3mock
        env:
          COM_ADOBE_TESTING_S3MOCK_STORE_INITIAL_BUCKETS: receipts
          COM_ADOBE_TESTING_S3MOCK_STORE_REGION: eu-west-1
        ports: ["9090:9090"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: corepack enable
      - run: pnpm install --frozen-lockfile
      - run: pnpm db:migrate
      - run: pnpm lint
      - run: pnpm typecheck
      - run: pnpm test
      - run: pnpm build
      - run: pnpm test:journey
      - run: pnpm test:privacy
      - run: pnpm eval:extraction
      - run: pnpm exec playwright install --with-deps chromium
      - run: pnpm test:e2e
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: playwright-report
          path: playwright-report
