services:
  postgres:
    image: postgres:17
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: receipts
    ports: ["5433:5432"]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d receipts"]
      interval: 2s
      retries: 30
    volumes: [pgdata:/var/lib/postgresql/data]
  s3:
    # MinIO images are no longer pullable (see docs/DECISIONS.md); adobe/s3mock speaks the S3 API.
    image: adobe/s3mock
    environment:
      COM_ADOBE_TESTING_S3MOCK_STORE_INITIAL_BUCKETS: receipts
      COM_ADOBE_TESTING_S3MOCK_STORE_REGION: eu-west-1
      COM_ADOBE_TESTING_S3MOCK_STORE_RETAIN_FILES_ON_EXIT: "true"
      debug: "false"
    ports: ["9090:9090"]
  mailpit:
    image: axllent/mailpit
    ports: ["1025:1025", "8025:8025"]
volumes:
  pgdata:
